<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strict policy: only files from this site may load, and the page may not send data anywhere. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; worker-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="MiCode - offline PowerShell and Base64 decoder. Everything runs locally in your browser.">
  <title>MiCode - Offline PowerShell &amp; Base64 Decoder</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="header-title">
        <h1><img src="icon.svg" alt="" width="28" height="28"> MiCode</h1>
        <p class="tagline">Offline PowerShell &amp; Base64 decoder</p>
      </div>

      <!-- Hanging Light Switch Pull Cord -->
      <div class="cord-fixture" id="theme-cord-container" role="button" tabindex="0" aria-label="Pull cord to toggle light mode" title="Pull cord down or click to toggle lights">
        <div class="cord-anchor-plate">
          <span id="bulb-indicator" class="cord-indicator-bulb bulb-off" title="Lighting Status"></span>
        </div>
        <div id="cord-interactive-area" class="cord-interactive-area">
          <div id="rope-stem" class="rope-stem"></div>
          <div id="cord-handle" class="cord-handle">
            <div class="cord-bead-top"></div>
            <div class="cord-bead-main">
              <div class="cord-bead-inner"></div>
            </div>
            <div class="cord-bead-cap"></div>
          </div>
          <div id="pull-cue" class="pull-cue"></div>
          <span id="cord-tooltip" class="cord-tooltip">Pull cord for Lights</span>
        </div>
      </div>
    </header>

    <section class="panel">
      <label for="input">Input</label>
      <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
        placeholder="Paste Base64 text or a PowerShell command, e.g.&#10;powershell.exe -NoP -W Hidden -enc SQBFAFgAIAAoACcAaABlAGwAbABvACcAKQA="></textarea>
      <div class="actions">
        <button id="decode" type="button" class="primary">Decode</button>
        <span class="hint">Ctrl + Enter</span>
      </div>
    </section>

    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section class="panel">
      <label for="output">Decoded output</label>
      <textarea id="output" readonly spellcheck="false" placeholder="Decoded text will appear here."></textarea>
      <div class="actions">
        <button id="copy" type="button">Copy</button>
        <button id="clear" type="button">Clear</button>
        <span id="copy-msg" class="hint" aria-live="polite"></span>
      </div>
    </section>

    <footer class="footer">
      All decoding happens locally in your browser. Nothing is uploaded or sent anywhere.
      Decoded content is shown as plain text and is never executed. Works offline after the first visit.
    </footer>
  </main>

  <script src="js/decoder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
